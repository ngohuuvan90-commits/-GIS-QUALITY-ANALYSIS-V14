name = "gis-quality-analysis-v14"
main = "worker.js"
compatibility_date = "2026-11-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "gis-quality-analysis-v14"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
ENVIRONMENT = "production"
