<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Đăng nhập | GIS QUALITY ANALYSIS</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#081b35,#123d62);font-family:Arial,sans-serif}.panel{width:min(420px,100%);padding:32px;background:#fff;border-radius:18px;box-shadow:0 20px 60px #0006;color:#172334}.brand{font-size:12px;font-weight:bold;letter-spacing:2px;color:#1264a3}.panel h1{font-size:25px;margin:12px 0 8px}.panel p{color:#65758b;margin:0 0 22px}.panel input{width:100%;padding:14px;margin:7px 0;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.panel button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#1264a3;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.panel button:disabled{opacity:.6}.error{display:block;color:#c33;min-height:22px;margin-top:12px;font-size:13px}.foot{margin-top:18px;text-align:center;color:#94a3b8;font-size:11px}
</style></head><body><main class="panel"><div class="brand">GIS VIETNAM</div><h1>GIS QUALITY ANALYSIS</h1><p>Đăng nhập để truy cập hệ thống phân tích chất lượng.</p><form id="login"><input name="username" autocomplete="username" placeholder="Tên tài khoản" required maxlength="40"><input name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required maxlength="200"><button id="submit" type="submit">ĐĂNG NHẬP</button><span class="error" id="error" role="alert"></span></form><div class="foot">Truy cập được bảo vệ · GIS VN</div></main><script src="/login.js" defer></script></body></html>
